<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climb Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#e6ebee;--surface:#f6f8f9;--ink:#17252e;--muted:#5b6b75;--line:#c3ccd2;--accent:#e0364f;--accent-ink:#fff;--on:#1f7a5c;--off:#b7791f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--surface:#1a252c;--ink:#e8eef1;--muted:#93a4ae;--line:#33444e;--accent:#ff5a72;--accent-ink:#1a0a0e;--on:#4cc9a0;--off:#f0b44c}}
:root[data-theme="dark"]{--bg:#10181d;--surface:#1a252c;--ink:#e8eef1;--muted:#93a4ae;--line:#33444e;--accent:#ff5a72;--accent-ink:#1a0a0e;--on:#4cc9a0;--off:#f0b44c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 40px/1 'Barlow Condensed',Impact,sans-serif;margin:6px 0 16px;letter-spacing:.5px}
h2{font:700 24px/1 'Barlow Condensed',Impact,sans-serif;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,button{font:inherit;color:var(--ink)}
input,select{width:100%;padding:11px 10px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;align-items:flex-end}.row>*{flex:1}.row>.fix{flex:0 0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.plus{width:46px;height:46px;padding:0;font-size:24px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.add{display:none;gap:8px;margin-top:8px}.add.open{display:flex}
.add input{flex:1}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{text-align:center;border-radius:12px;padding:16px;margin-top:14px;border:2px solid var(--line)}
.timer.get{background:#6a3bbf;border-color:#6a3bbf}
.timer.on{background:#16803c;border-color:#16803c}
.timer.off{background:#c42638;border-color:#c42638}
.timer.get,.timer.on,.timer.off{color:#fff}
.timer.get .sub,.timer.on .sub,.timer.off .sub{color:#fff}
.timer.get button,.timer.on button,.timer.off button{background:#fff;color:#111;border-color:#fff}
.phase{font:700 26px 'Barlow Condensed',sans-serif}
.timer.get .big,.timer.on .big,.timer.off .big{text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big{font:700 92px/1 'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14px}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px}
.sets{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:12px}
.sets b{font:700 44px 'Barlow Condensed',sans-serif;min-width:50px;text-align:center}
.sets button{width:46px;height:46px;font-size:22px;padding:0}
.hist{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:10px;justify-content:space-between}
.hist small{color:var(--muted);display:block}
.hist button{padding:6px 10px;font-size:13px;align-self:flex-start}
#msg{color:var(--on);font-weight:600;margin:8px 0 0;min-height:1.2em}
</style>
</head>
<body>
<main>
<div class="top"><h1>Climb Log</h1><button id="open-hist">History</button></div>
<div id="view-log">

<section class="card">
  <label for="date" style="margin-top:0">Date</label>
  <input type="date" id="date">
  <label>Workout types (pick as many as you did)</label>
  <div class="chips" id="types"></div>
</section>

<section class="card hide" id="sec-board">
  <h2>Training board</h2>
  <label for="board">Which board</label>
  <div class="row"><select id="board"></select><button class="plus fix" data-add="board" aria-label="Add a training board">+</button></div>
  <div class="add" id="add-board"><input placeholder="Board name, e.g. Moonboard 2016" aria-label="New board name"><button class="primary">Add</button></div>
  <label for="board-time">Time climbing</label>
  <select id="board-time"></select>
</section>

<section class="card hide" id="sec-hang">
  <h2>Hangboard</h2>
  <label for="hb">Which hangboard</label>
  <div class="row"><select id="hb"></select><button class="plus fix" data-add="hb" aria-label="Add a hangboard">+</button></div>
  <div class="add" id="add-hb"><input placeholder="Hangboard name, e.g. Tension Flash" aria-label="New hangboard name"><button class="primary">Add</button></div>
  <label for="wo">Workout</label>
  <div class="row"><select id="wo"></select><button class="plus fix" data-add="wo" aria-label="Add a workout">+</button></div>
  <div class="add" id="add-wo"><input placeholder="Workout name, e.g. 7/3 repeaters" aria-label="New workout name"><button class="primary">Add</button></div>
  <div id="wo-edit" class="hide">
    <label for="wo-name">Name of workout</label>
    <input id="wo-name">
    <div class="grid3">
      <div><label for="wo-on">Secs on</label><input id="wo-on" type="number" min="1" inputmode="numeric"></div>
      <div><label for="wo-off">Secs off</label><input id="wo-off" type="number" min="0" inputmode="numeric"></div>
      <div><label for="wo-reps">Reps</label><input id="wo-reps" type="number" min="1" inputmode="numeric"></div>
    </div>
    <div class="sets" aria-label="Sets">
      <button id="set-minus" aria-label="Remove a set">&minus;</button>
      <div style="text-align:center"><b id="sets">0</b><div class="sub">sets</div></div>
      <button id="set-plus" aria-label="Add a set">+</button>
    </div>
    <div class="timer" id="timer" aria-live="off">
      <div class="phase" id="phase">Ready</div>
      <div class="big" id="clock">0</div>
      <div class="sub" id="tinfo"></div>
      <div class="ctl"><button class="primary" id="t-go">Start</button><button id="t-reset">Reset</button></div>
      <div class="sub" style="margin-top:8px">Counts up through each hang and rest. A set is added when all reps finish.</div>
    </div>
  </div>
</section>

<section class="card hide" id="sec-gym">
  <h2>Gym</h2>
  <div class="row">
    <div><label for="g-state" style="margin-top:0">State</label><select id="g-state"></select></div>
    <div><label for="g-city" style="margin-top:0">City</label><input id="g-city" autocomplete="address-level2"></div>
  </div>
  <label for="g-name">Gym name</label>
  <input id="g-name">
  <label for="g-time">Time climbing</label>
  <select id="g-time"></select>
</section>

<section class="card hide" id="sec-stretch">
  <h2>Stretching</h2>
  <label for="s-time" style="margin-top:0">Time stretching</label>
  <select id="s-time"></select>
</section>

<button class="primary" id="save" style="width:100%;padding:14px;font-size:18px">Save workout</button>
<p id="msg" role="status"></p>

</div>
<div id="view-hist" class="hide">
<button id="back">&larr; Back to workout</button>
<h2 style="margin-top:18px">History</h2>
<section class="card" id="hist"></section>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let boards=store.get('boards',['Moonboard','Kilter Board','Tension Board']);
const BUILTIN_HB=`Atomik - Yaniro Power
Awesome Woodys - Cliff Board Micro
Awesome Woodys - Cliff Board Mini
Awesome Woodys - Cliff Board Petite
Awesome Woodys - Cliff Board Wide Boy
Awesome Woodys - Home Boy
Beastmaker 1000
Beastmaker 2000
Crusher Holds - CAC Fingerboard
Crusher Holds - Matrix
Crusher Holds - Megarail
Crusher Holds - Mission
Crusher Holds - Neo
Crusher Holds - Orb
Crusher Holds - Recruit
Crusher Holds - Send
Crusher Holds - Slave
Escape Climbing - SendBoard
Eva López / JM Climbing - Progression
Eva López / JM Climbing - Transgression
Frictitious Climbing - The Megalith
Gripnatic - FingerPeg 1.0
Lattice Training - Mega Bar
Lattice Training - Mini Bar
Lattice Training - Triple Rung
Max Climbing - One Finger Trainer
Max Climbing - Spinchboard
Max Climbing - Spinchboard Solo
Max Climbing - Spinchboard Solo Hybrid
Metolius - Climbers Edge
Metolius - Contact
Metolius - Foundry
Metolius - Light Rail
Metolius - Light Rail 2.0
Metolius - Prime Rib
Metolius - Project
Metolius - Simulator 3D
Metolius - Wood Grips II Compact
Metolius - Wood Grips II Deluxe
Moon Climbing - Moon Fingerboard
Moon Climbing - Phat Boy Fingerboard
Nature Climbing - Board II
Nature Climbing - Oakboard
Nature Climbing - Raw Hanger
Nature Climbing - Stoak Board III
Nature Climbing - Stone Hanger
OCÚN - Finger Board
Problemsolver - Hanzo
Problemsolver - Station
PUC Series - Il Domani
Rustam's - Bombita
Rustam's - Fusion
Rustam's - Moro
Rustam's - Pinchette
So iLL - Iron Palm
So iLL - Iron Palm 2.0
So iLL - Iron Palm Clear VTF
So iLL - Rise
So iLL - Split Palm
Tension Climbing - Flash Board
Tension Climbing - Grindstone
Tension Climbing - Grindstone Mk2
Tension Climbing - Grindstone Pro
Tension Climbing - Honestone
Tension Climbing - Simple Board
Tension Climbing - Whetstone
Trango - Rock Prodigy Forge
Trango - Rock Prodigy Pivot
Trango - Rock Prodigy Training Center
Workshop 19/50 - Cascade Plus
Workshop 19/50 - Ergo
YY Vertical - La Baguette
YY Vertical - La Baguette Evo
YY Vertical - Travelboard
YY Vertical - VerticalBoard Evo
YY Vertical - VerticalBoard First
YY Vertical - VerticalBoard Light
YY Vertical - VerticalBoard One
Zlagboard - Evo
Zlagboard - Mini
Zlagboard - Pro
Zlagboard - Vario`.split('\n');
const sortHB=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,undefined,{sensitivity:'base'}));
let hangboards=sortHB([...BUILTIN_HB,...store.get('hangboards',[]).filter(n=>n!=='Tension Flash')]);
let workouts=store.get('workouts',[{id:1,hb:'Beastmaker 1000',name:'7/3 repeaters',on:7,off:3,reps:6},{id:2,hb:'Tension Climbing - Flash Board',name:'Max hangs',on:10,off:180,reps:1}]);
workouts.forEach(w=>{if(w.hb==='Tension Flash')w.hb='Tension Climbing - Flash Board'});
let history=store.get('history',[]);
let types=new Set(), sets=0, curWo=null;
const TYPES=['Training board','Hangboard','Gym','Stretching'];
const SECS={'Training board':'#sec-board','Hangboard':'#sec-hang','Gym':'#sec-gym','Stretching':'#sec-stretch'};
const STATES=['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];

function fmtMin(m){const h=Math.floor(m/60),r=m%60;return h?(r?`${h} h ${r} min`:`${h} h`):`${m} min`}
function fill(sel,items,ph){sel.innerHTML=(ph?`<option value="">${ph}</option>`:'')+items.map(i=>`<option>${i}</option>`).join('')}
function timeOpts(sel){sel.innerHTML='<option value="">Select time</option>'+Array.from({length:60},(_,i)=>`<option value="${(i+1)*5}">${fmtMin((i+1)*5)}</option>`).join('')}

// date
const today=new Date();$('#date').value=new Date(today.getTime()-today.getTimezoneOffset()*6e4).toISOString().slice(0,10);

// chips
$('#types').innerHTML=TYPES.map(t=>`<button class="chip" aria-pressed="false" data-t="${t}">${t}</button>`).join('');
$('#types').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const t=b.dataset.t,on=!types.has(t);
  on?types.add(t):types.delete(t);
  b.setAttribute('aria-pressed',on);
  $(SECS[t]).classList.toggle('hide',!on);
});

// selects
['#board-time','#g-time','#s-time'].forEach(s=>timeOpts($(s)));
fill($('#g-state'),STATES,'State');
fill($('#board'),boards,'Select board');
fill($('#hb'),hangboards,'Select hangboard');

// add (+) controls
const adders={
  board:v=>{if(!boards.includes(v))boards.push(v);store.set('boards',boards);fill($('#board'),boards,'Select board');$('#board').value=v},
  hb:v=>{if(!hangboards.includes(v))hangboards.push(v);hangboards=sortHB(hangboards);store.set('hangboards',hangboards);fill($('#hb'),hangboards,'Select hangboard');$('#hb').value=v;loadWorkouts()},
  wo:v=>{if(!$('#hb').value){flash('Choose a hangboard first.');return}
    const w={id:Date.now(),hb:$('#hb').value,name:v,on:7,off:3,reps:6};workouts.push(w);store.set('workouts',workouts);loadWorkouts(w.id)}
};
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-add]');
  if(p){const box=$('#add-'+p.dataset.add);box.classList.toggle('open');if(box.classList.contains('open'))box.querySelector('input').focus();return}
  const box=e.target.closest('.add');
  if(box&&e.target.tagName==='BUTTON')submitAdd(box)
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('.add'))submitAdd(e.target.closest('.add'))});
function submitAdd(box){
  const inp=box.querySelector('input'),v=inp.value.trim();if(!v)return;
  adders[box.id.replace('add-','')](v);inp.value='';box.classList.remove('open');
}

// hangboard workouts
function loadWorkouts(selectId){
  const hb=$('#hb').value,list=workouts.filter(w=>w.hb===hb);
  $('#wo').innerHTML='<option value="">Select workout</option>'+list.map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
  if(selectId)$('#wo').value=selectId;
  pickWorkout();
}
function pickWorkout(){
  curWo=workouts.find(w=>String(w.id)===$('#wo').value)||null;
  $('#wo-edit').classList.toggle('hide',!curWo);
  resetTimer();
  if(!curWo)return;
  $('#wo-name').value=curWo.name;$('#wo-on').value=curWo.on;$('#wo-off').value=curWo.off;$('#wo-reps').value=curWo.reps;
  sets=0;$('#sets').textContent=0;
}
$('#hb').addEventListener('change',loadWorkouts);
$('#wo').addEventListener('change',pickWorkout);
[['#wo-name','name'],['#wo-on','on'],['#wo-off','off'],['#wo-reps','reps']].forEach(([s,k])=>{
  $(s).addEventListener('input',()=>{
    if(!curWo)return;
    curWo[k]=k==='name'?$(s).value:Math.max(k==='off'?0:1,parseInt($(s).value)||0);
    store.set('workouts',workouts);
    if(k==='name'){const o=$('#wo').selectedOptions[0];if(o)o.textContent=curWo.name}
    resetTimer();
  });
});
function setSets(n){sets=Math.max(0,n);$('#sets').textContent=sets}
$('#set-plus').onclick=()=>setSets(sets+1);
$('#set-minus').onclick=()=>setSets(sets-1);

// count-up timer
let T={run:false,phase:'ready',rep:1,start:0,elapsed:0,iv:null,last:-1};
function beep(f,d){try{const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function resetTimer(){
  clearInterval(T.iv);T={run:false,phase:'ready',rep:1,start:0,elapsed:0,iv:null,last:-1};drawTimer();$('#t-go').textContent='Start'
}
function drawTimer(){
  const el=$('#timer');if(!curWo)return;
  el.className='timer'+(T.phase==='get'?' get':T.phase==='on'?' on':T.phase==='off'?' off':'');
  $('#phase').textContent={ready:'Ready',get:'Get ready',on:'Hang',off:'Rest',done:'Set complete'}[T.phase];
  const target=T.phase==='get'?7:T.phase==='on'?curWo.on:T.phase==='off'?curWo.off:0;
  $('#clock').textContent=T.phase==='ready'?'0':T.phase==='done'?'✓':Math.floor(T.elapsed);
  $('#tinfo').textContent=T.phase==='ready'?`${curWo.on}s on · ${curWo.off}s off · ${curWo.reps} reps`:T.phase==='done'?`Sets logged: ${sets}`:`of ${target}s · rep ${T.rep} of ${curWo.reps}`;
}
function tick(){
  if(!T.run)return;
  T.elapsed=(Date.now()-T.start)/1000;
  const target=T.phase==='get'?7:T.phase==='on'?curWo.on:curWo.off;
  const whole=Math.floor(T.elapsed);
  if(whole!==T.last){T.last=whole;if(target-whole<=3&&target-whole>0)beep(660,.08)}
  if(T.elapsed>=target)advance();
  drawTimer();
}
function enter(phase){T.phase=phase;T.start=Date.now();T.elapsed=0;T.last=-1}
function advance(){
  if(T.phase==='get'){beep(880,.3);enter('on');return}
  if(T.phase==='on'){
    if(T.rep>=curWo.reps)return finish();
    if(curWo.off>0){beep(440,.3);enter('off')}else{T.rep++;beep(880,.3);enter('on')}
  }else{T.rep++;beep(880,.3);enter('on')}
}
function finish(){
  clearInterval(T.iv);T.run=false;T.phase='done';setSets(sets+1);beep(880,.6);$('#t-go').textContent='Go again';
}
$('#t-go').onclick=()=>{
  if(!curWo)return;
  if(T.run){T.run=false;clearInterval(T.iv);T.paused=T.elapsed;$('#t-go').textContent='Resume';return}
  if(T.phase==='ready'||T.phase==='done'){T.rep=1;enter('get');T.paused=0}
  else T.start=Date.now()-(T.paused||0)*1000;
  T.run=true;beep(880,.3);clearInterval(T.iv);T.iv=setInterval(tick,100);$('#t-go').textContent='Pause';drawTimer();
};
$('#t-reset').onclick=resetTimer;

// save + history
function flash(t){$('#msg').textContent=t;setTimeout(()=>{if($('#msg').textContent===t)$('#msg').textContent=''},3500)}
$('#save').onclick=()=>{
  if(!types.size){flash('Pick at least one workout type.');return}
  const e={id:Date.now(),date:$('#date').value,parts:[]};
  if(types.has('Training board'))e.parts.push(`Training board: ${$('#board').value||'no board chosen'}${$('#board-time').value?', '+fmtMin(+$('#board-time').value):''}`);
  if(types.has('Hangboard')){const w=curWo;e.parts.push(w?`Hangboard (${$('#hb').value}): ${w.name}, ${w.on}s on / ${w.off}s off × ${w.reps} reps, ${sets} sets`:`Hangboard: ${$('#hb').value||'no workout chosen'}`)}
  if(types.has('Gym')){const loc=[$('#g-city').value.trim(),$('#g-state').value].filter(Boolean).join(', ');e.parts.push(`Gym: ${$('#g-name').value.trim()||'unnamed'}${loc?' ('+loc+')':''}${$('#g-time').value?', '+fmtMin(+$('#g-time').value):''}`)}
  if(types.has('Stretching'))e.parts.push(`Stretching${$('#s-time').value?': '+fmtMin(+$('#s-time').value):''}`);
  history.unshift(e);store.set('history',history);renderHist();flash('Workout saved.');
};
function renderHist(){
  $('#hist').innerHTML=history.length?history.map(h=>`<div class="hist"><div><b>${new Date(h.date+'T12:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</b>${h.parts.map(p=>`<small>${p.replace(/</g,'&lt;')}</small>`).join('')}</div><button data-del="${h.id}">Delete</button></div>`).join(''):'<span class="sub">No workouts yet. Pick a type above and save your first session.</span>';
}
$('#hist').addEventListener('click',e=>{const d=e.target.dataset.del;if(!d)return;history=history.filter(h=>String(h.id)!==d);store.set('history',history);renderHist()});
renderHist();
function showHist(on){$('#view-log').classList.toggle('hide',on);$('.top').style.display=on?'none':'flex';$('#view-hist').classList.toggle('hide',!on);window.scrollTo(0,0)}
$('#open-hist').onclick=()=>showHist(true);
$('#back').onclick=()=>showHist(false);
</script>
</body>
</html>
